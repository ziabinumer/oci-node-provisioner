name: OCI Provisioner Test

on:
  workflow_dispatch:

jobs:
  attempt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK Requirements
        run: pip install -r requirements.txt

      - name: Test
        run: |
          python --version
          python -c "import oci; print('OCI SDK imported successfully')"
