import oci
import os

config = {
    "user": os.getenv("OCI_USER_ID"),
    "key_content": os.getenv("OCI_PRIVATE_KEY"),
    "fingerprint": os.getenv("OCI_FINGERPRINT"),
    "tenancy": os.getenv("OCI_TENANCY_ID"),
    "region": os.getenv("OCI_REGION")
}

print(f"Testing OCI region: {config['region']}")

try:
    identity_client = oci.identity.IdentityClient(config)

    tenancy = identity_client.get_tenancy(
        config["tenancy"]
    ).data

    print("======================================")
    print("OCI AUTHENTICATION SUCCESSFUL")
    print("======================================")
    print(f"Tenancy name: {tenancy.name}")
    print(f"Region: {config['region']}")

except Exception as e:
    print("======================================")
    print("OCI AUTHENTICATION FAILED")
    print("======================================")
    print(type(e).__name__)
    print(e)
    exit(1)
